# Abre o app e passa pelo Dev Launcher (development build) se ele aparecer.
appId: com.itbuilder.vezzo
---
- launchApp:
    stopApp: true
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: ".*:8081"
# O dev client mostra uma folha de boas-vindas do menu de desenvolvedor na primeira carga.
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn:
          point: "50%,8%"
- extendedWaitUntil:
    visible: "Hoje|Today|Olá.*|Hi, .*|Criar conta|Create account"
    timeout: 60000
