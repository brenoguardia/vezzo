services:
  mongo:
    image: mongo:7
    container_name: vezzo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Prisma exige replica set (transações), mesmo em nó único.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - vezzo-mongo-data:/data/db
    healthcheck:
      # Inicializa o replica set na primeira execução e valida que está pronto.
      test: |
        mongosh --quiet --port 27017 --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }).ok
          }
        '
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  vezzo-mongo-data:
